<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto de vista Cicio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Link para o arquivo CSS -->
    <link rel="stylesheet" href="dem.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0d0814;
            color: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
        }


        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            color: #a855f7;
            text-transform: uppercase;
            letter-spacing: 2px;


            text-shadow:
                1px 1px 0px #9333ea,
                2px 2px 0px #7e22ce,
                3px 3px 0px #6b21a8,
                4px 4px 0px #581c87,
                5px 5px 0px #3b0764,
                6px 6px 12px rgba(0, 0, 0, 0.7);
        }

        .album-container {
            display: grid;

            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }


        .foto-card {
            position: relative;
            height: 250px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #3b0764;
            cursor: pointer;


            transform: translateZ(0);
            -webkit-backface-visibility: hidden;


            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }


        .foto-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .foto-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            background: rgba(24, 9, 38, 0.65);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .foto-overlay span {
            font-weight: 700;
            font-size: 1.1rem;
            color: #f3e8ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }



        .foto-card:hover {
            transform: translateY(-6px);
            border-color: #c084fc;
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.35);
        }

        .foto-card:hover img {
            transform: scale(1.15);
        }

        .foto-card:hover .foto-overlay {
            opacity: 1;
        }

        .foto-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .foto-card:hover video {
            transform: scale(1.15);
        }
    </style>
</head>

<body>
    <audio id="musicaFundo" loop>
        <source src="deixa-lagumm.mp3" type="audio/mpeg">
    </audio>

    <header class="header">
        <h1>Ponto de vista Natalinda</h1>
    </header>

    <main class="album-container">

        <div class="foto-card">
            <img src="img/foto18.jpeg" alt="Foto 18">
            <div class="foto-overlay"><span>dorminor</span></div>
        </div>
        <div class="foto-card">
            <img src="img/foto20.jpeg" alt="Foto 20">
            <div class="foto-overlay"><span>cheiro no cangote</span></div>
        </div>
        <div class="foto-card">
            <img src="img/foto21.jpeg" alt="Foto 21">
            <div class="foto-overlay"><span>flarinthians</span></div>
        </div>
        <div class="foto-card">
            <img src="img/foto19.jpeg" alt="Foto 19">
            <div class="foto-overlay"><span>FOFOSSSSSS</span></div>
        </div>
        <div class="foto-card">
            <img src="img/foto16.jpeg" alt="Foto 16">
            <div class="foto-overlay"><span>bejinhor</span></div>
        </div>
        <div class="foto-card">
            <img src="img/foto15.jpeg" alt="Foto 15">
            <div class="foto-overlay"><span>mãos dadas na rua</span></div>
        </div>
        <div class="foto-card">
            <img src="img/foto17.jpeg" alt="Foto 17">
            <div class="foto-overlay"><span>palestra do jaguaribis</span></div>
        </div>
        <div class="foto-card"><a href="carta.html"><img src="img/carta.png" alt="Foto Carta aberta"></a>
            <div class="foto-overlay"><span>carta aberta</span></div>
        </div>


    </main>


    <script>
        const videoCards = document.querySelectorAll('.video-card');
        videoCards.forEach(card => {
            const video = card.querySelector('video');
            card.addEventListener('mouseenter', () => {
                video.play();
            });
            card.addEventListener('mouseleave', () => {
                video.pause();
                video.currentTime = 0
            });
        });


        window.addEventListener('DOMContentLoaded', () => {
            const musica = document.getElementById('musicaFundo');

            // Tenta tocar automaticamente
            let playPromise = musica.play();

            if (playPromise !== undefined) {
                playPromise.catch(() => {

                    document.body.addEventListener('click', () => {
                        musica.play();
                    }, { once: true });
                });
            }
        });
    </script>
</body>

</html>
